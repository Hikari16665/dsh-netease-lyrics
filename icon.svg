<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NetEase lyrics layer">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.55" stop-color="#c77dff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b22"/>
      <stop offset="1" stop-color="#0d0d12"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#g)" stroke-opacity="0.55" stroke-width="1.6"/>
  <!-- 背景层（下半）：两条歌词线，用渐变与不透明度示意"层" -->
  <rect x="10" y="40" width="34" height="4.4" rx="2.2" fill="url(#g)" opacity="0.95"/>
  <rect x="18" y="49" width="26" height="3.6" rx="1.8" fill="url(#g)" opacity="0.5"/>
  <!-- 前景音符：代表被 hook 的演唱中的那一句 -->
  <g fill="url(#g)">
    <circle cx="22.5" cy="25.5" r="5.4"/>
    <rect x="26.4" y="9.5" width="2.6" height="16.6" rx="1.3"/>
    <path d="M29 9.5c6.4 1.2 9.6 3.4 9.6 6.6 0 1.5-.8 2.6-2.2 3.3.5-2.6-.9-4.6-4.2-6.1z"/>
  </g>
  <!-- 进度高亮：示意逐字卡拉OK -->
  <rect x="10" y="40" width="17" height="4.4" rx="2.2" fill="#fff" opacity="0.85"/>
</svg>
